[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.4"

tokio = { version = "1.53.1", features = ["full"] }
argon2 = "0.6.0"
rand = "0.9"
dotenvy = "0.15.7"
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }


sea-orm = { version = "2.0.4", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "entity-registry",
    "schema-sync",
] }
sea-orm-migration = { version = "2.0.2", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
